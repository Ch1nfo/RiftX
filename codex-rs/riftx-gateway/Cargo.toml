[package]
name = "codex-riftx-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "riftxd"
path = "src/main.rs"

[lib]
name = "codex_riftx_gateway"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
clap = { workspace = true, features = ["derive"] }
codex-arg0 = { workspace = true }
codex-riftx-artifacts = { workspace = true }
codex-riftx-core = { workspace = true }
codex-riftx-app-server-adapter = { workspace = true }
codex-riftx-ipc = { workspace = true }
codex-riftx-skills = { workspace = true }
codex-riftx-tools = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { workspace = true, features = ["io"] }
uuid = { workspace = true, features = ["v4"] }
url = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
