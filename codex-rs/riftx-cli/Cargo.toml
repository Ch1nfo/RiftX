[package]
name = "codex-riftx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "riftx"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
codex-riftx-core = { workspace = true }
codex-riftx-credentials = { workspace = true }
codex-riftx-ipc = { workspace = true }
codex-riftx-skills = { workspace = true }
codex-riftx-tools = { workspace = true }
futures = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
