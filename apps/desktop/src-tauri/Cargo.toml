[package]
name = "riftx-desktop"
version = "1.0.0"
description = "RiftX desktop application"
authors = ["RiftX contributors"]
edition = "2024"
license = "Apache-2.0"

[lib]
name = "riftx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codex-riftx-core = { path = "../../../codex-rs/riftx-core" }
codex-riftx-credentials = { path = "../../../codex-rs/riftx-credentials" }
codex-riftx-ipc = { path = "../../../codex-rs/riftx-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-shell = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt", "rt-multi-thread", "sync", "time"] }
toml = "0.9"

[workspace]

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
