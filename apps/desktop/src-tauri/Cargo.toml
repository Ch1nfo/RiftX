[package]
name = "riftx-desktop"
version = "0.7.0"
description = "RiftX desktop application"
authors = ["RiftX contributors"]
edition = "2024"
license = "Apache-2.0"

[lib]
name = "riftx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codex-riftx-credentials = { path = "../../../codex-rs/riftx-credentials" }
codex-riftx-ipc = { path = "../../../codex-rs/riftx-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "sync", "time"] }
toml = "0.9"

[workspace]

[dev-dependencies]
pretty_assertions = "1"
