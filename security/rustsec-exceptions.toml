schema_version = 1

# Temporary, reviewable exceptions only. The audit wrapper fails when an exception
# expires, no longer matches the audited crate/version, or a new vulnerability appears.

[[exception]]
id = "RUSTSEC-2026-0119"
crate = "hickory-proto"
versions = ["0.25.2"]
expires = "2026-09-30"
release_reachable = true
scope = "riftxd outbound DNS through rama-dns 0.3.0-alpha.4"
reason = "The encoder only receives DNS names already bounded by URL/hostname syntax; RiftX does not encode attacker-supplied DNS record sets. Rama 0.3.0 is the first line with Hickory 0.26 but requires Rust 1.96, while the frozen upstream runtime currently requires Rust 1.95. Remove this exception with the Rust/Rama upgrade."

[[exception]]
id = "RUSTSEC-2026-0118"
crate = "hickory-proto"
versions = ["0.25.2"]
expires = "2026-09-30"
release_reachable = false
scope = "DNSSEC NSEC3 validation"
reason = "The release graph enables hickory-proto futures-io/std only; dnssec validation is not enabled. Rama 0.3.0 requires Rust 1.96. Remove this exception with the Rust/Rama upgrade."

