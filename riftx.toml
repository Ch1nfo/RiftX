[gateway]
listen = "127.0.0.1:8787"
operator_token_env = "RIFTX_OPERATOR_TOKEN"
state_db = ".riftx/state.sqlite"
runtime_home = ".riftx/runtime"
workspace_root = ".riftx/workspaces"

[llm]
model = "gpt-5.2"
base_url = "https://api.openai.com/v1"
api_key_env = "RIFTX_LLM_API_KEY"

[policy]
allowed_tools = []
denied_cidrs = []
denied_domains = []

[audit]
jsonl_path = ".riftx/audit.jsonl"
fsync = true

[artifacts]
root = ".riftx/artifacts"
max_bytes_per_engagement = 1073741824

[tool_profiles.native]
allowed_tools = []
approval = "high_risk"

[tool_profiles.native.scope]
cidrs = ["0.0.0.0/0", "::/0"]
domains = ["*"]
ports = []
