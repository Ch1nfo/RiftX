[daemon]
ipc_dir = ".riftx/ipc"
state_db = ".riftx/state.sqlite"
runtime_home = ".riftx/runtime"
workspace_root = ".riftx/workspaces"

[tools]
directories = []
extra_paths = []

[skills]

[llm]
model = "gpt-5.2"
base_url = "https://api.openai.com/v1"
api_key_env = "RIFTX_LLM_API_KEY"

[policy]
allowed_capabilities = [
  "network.discovery",
  "service.enumeration",
  "web.discovery",
  "content.discovery",
  "vulnerability.scanning",
  "vulnerability.validation",
  "credential.testing",
  "attack_path.analysis",
  "lateral_movement",
  "privilege_escalation",
  "code_execution",
  "evidence.capture",
]
denied_cidrs = []
denied_domains = []

[audit]
jsonl_path = ".riftx/audit.jsonl"
fsync = true

[artifacts]
root = ".riftx/artifacts"
max_bytes_per_engagement = 1073741824
