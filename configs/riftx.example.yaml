server:
  host: 127.0.0.1
  port: 8787
  cors_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173
  sse_poll_interval_seconds: 0.5
  sse_heartbeat_seconds: 15

database:
  url: sqlite+aiosqlite:///./.riftx/riftx.db

temporal:
  target: 127.0.0.1:7233
  namespace: default
  task_queue: riftx-v2
  workflow_id_prefix: riftx-run
  max_concurrent_activities: 20
  max_cached_workflows: 1000
  # Set true for managed/remote Temporal. With no paths below, TLS uses system roots.
  tls_enabled: false
  # Optional PEM file paths for private PKI or mTLS; never place PEM contents in YAML.
  # tls_server_root_ca_path: /etc/riftx/temporal/server-ca.pem
  # tls_server_name: temporal.example.internal
  # tls_client_cert_path: /etc/riftx/temporal/client-cert.pem
  # tls_client_private_key_path: /etc/riftx/temporal/client-key.pem
  # Set an API key only through RIFTX_TEMPORAL_API_KEY, never YAML.

runner:
  mode: local
  endpoint: http://127.0.0.1:8790
  node_id: local
  state_path: .riftx/runner
  # Keep identity credentials outside clonable execution state.
  credential_path: .riftx/secrets/runner-credentials.json
  # Set registration_token only through an owner-scoped
  # RIFTX_RUNNER_REGISTRATION_TOKEN environment or equivalent process-scoped secret
  # injection, never YAML or process argv. There is no CLI token option.
  # Any configured value must contain at least 32 printable, non-whitespace ASCII
  # characters and be independently generated from RIFTX_ADMIN_TOKEN.
  command_lease_seconds: 30
  node_offline_after_seconds: 30
  node_lost_after_seconds: 300

execution:
  policy: registered_only
  default_timeout: 1800
  environment_mode: inherit
  # Safe production default. Linux Runners need a trusted delegated cgroup v2
  # root in RIFTX_CGROUP_V2_ROOT. Set false only for local development where
  # an uncontained process can never be reported as affirmatively stopped.
  require_containment: true
  # Required on Linux when containment is enabled. Use a dedicated unprivileged
  # account that is different from the Runner and cannot administer cgroups.
  # Prefer RIFTX_PAYLOAD_UID/RIFTX_PAYLOAD_GID for host-specific numeric IDs.
  payload_uid: null
  payload_gid: null

execution_output:
  max_inline_bytes: 32768
  preview_head_bytes: 8192
  preview_tail_bytes: 8192
  max_context_tokens: 2000

workspace:
  root: .riftx/workspaces

# RiftX Code Audit remains an admission-disabled, side-effect-free feature during
# development. Source roots are deployment authorization, not a scan request;
# an empty list is deny-all and never falls back to the current directory.
audit:
  enabled: false
  # RiftX 3.0 is deliberately same-node only.
  node_mode: local_same_node
  allowed_node_ids: [local]
  # The signing key itself must come from RIFTX_AUDIT_PREFLIGHT_TOKEN_KEY as
  # canonical unpadded base64url for exactly 32 random bytes; never store it here.
  preflight_token_key_id: primary
  source_roots: []
  # Keep every Audit storage root absolute, persistent, and outside source_roots.
  snapshot_root: /var/lib/riftx/audit/snapshots
  temp_root: /var/lib/riftx/audit/tmp
  fix_root: /var/lib/riftx/audit/fixes
  default_mode: standard
  default_analysis_profile: deterministic
  model_egress:
    default_mode: local_only
    max_bytes_per_call: 131072
    max_bytes_per_audit: 16777216
    allow_remote_origins: []
  max_repository_bytes: 2147483648
  max_file_bytes: 5242880
  max_files: 200000
  max_path_bytes: 4096
  max_directory_depth: 256
  max_artifact_bytes: 67108864
  max_total_artifact_bytes: 268435456
  workers:
    max_parallel: 4
    max_epochs: 8
    saturation_epochs: 2
  budget:
    max_wall_seconds: 7200
    max_model_calls: 100
    max_input_tokens: 2000000
    max_output_tokens: 200000
    max_worker_jobs: 64
    max_candidates: 1000
  validation:
    default_policy: static_only
    require_sandbox: true
    default_network: none
    max_wall_seconds: 900
    max_memory_mib: 2048
    max_pids: 128

approval:
  default_mode: balanced

tools:
  path: configs/tools.yaml

web:
  dist_path: apps/web/dist
  search:
    enabled: true
    # openai_hosted uses the active Run model profile only when it is an
    # official OpenAI profile without a custom base_url. Add searxng to
    # federate both providers or use it as a fallback.
    providers: [openai_hosted]
    # searxng_endpoint: https://search.example.com
    timeout_seconds: 30

models:
  path: configs/models.yaml
  secrets_path: .riftx/secrets/models.json
  # profile: primary

# Optional operator-managed, content-only LSP gateway. RiftX sends only bounded
# relative paths and source content through the Unix socket; it never starts a
# project language server or loads project configuration itself. The socket and
# its parent directory must be owned by the Worker account and not group/world
# writable. The bearer token is read from token_env and must not be stored here. Any unavailable,
# untrusted, unsupported, or invalid response falls back explicitly to builtin_static.
code:
  lsp:
    enabled: false
    # socket_path: /run/user/1000/riftx-controlled-lsp.sock
    # backend_id: organization-lsp
    # backend_version: 1.0.0
    # token_env: RIFTX_CODE_LSP_TOKEN
    timeout_seconds: 15

# The current release implements exactly one explicit deployment profile.
# RIFTX_ADMIN_TOKEN is the shared local operator/admin credential and must come
# from the process environment, never YAML. It must contain at least 32 printable,
# non-whitespace ASCII characters and be generated from a secure random source. If a
# Runner bootstrap token is configured, it must contain at least 32 printable,
# non-whitespace ASCII characters and be an independently generated value delivered
# only through an owner-scoped RIFTX_RUNNER_REGISTRATION_TOKEN environment or equivalent
# process-scoped secret injection, never process argv.
# The stable Principal ID below is
# generated server-side on first start and the state file is kept owner-only.
# Non-loopback binds, remote identity/proxy auth, and remote_multiuser all fail
# closed until that separate profile's TLS/session/CSRF/tenant ACL work exists.
security:
  trust_profile: local_single_operator
  local_principal_path: .riftx/secrets/local-principal.json
  trust_proxy_auth: false

agent:
  max_history_items: 100
  max_turns: 10

subagents:
  max_depth: 1
  max_parallel_per_run: 4
  max_total_per_run: 20

hooks:
  default_timeout_seconds: 10
  failure_policy: warn

mcp:
  max_concurrent_per_server: 2
  max_concurrent_total: 16
  discovery_timeout_seconds: 15
  refresh_interval_seconds: 60
  max_tools_per_server: 256
  max_schema_bytes: 65536
  max_call_argument_bytes: 1048576
  max_call_result_bytes: 16777216
  circuit_breaker:
    failure_threshold: 3
    cooldown_seconds: 60
  # Remote Streamable HTTP servers are discovered at Worker startup. Secrets are
  # referenced by environment variable name and never copied into model-visible metadata.
  # A missing allowed_tools list is discovery-only; only explicitly listed tools may run.
  servers: {}
