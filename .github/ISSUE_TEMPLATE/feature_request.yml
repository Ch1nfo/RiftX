name: Feature request
description: Propose a scoped improvement to the supported RiftX product surface.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user outcome that is currently blocked.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Minimal proposed change
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and compatibility boundaries
      description: Note effects on authorization, scope, credentials, execution, evidence, or stop behavior.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request targets the current Pentest-first product surface.
          required: true
