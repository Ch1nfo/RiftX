name: Linux Security

on:
  pull_request:
    paths:
      - "services/sandbox-managerd/**"
      - "deploy/**"
      - "scripts/riftx/**"
      - "security/**"
      - "codex-rs/riftx-app-server-adapter/**"
      - ".github/workflows/linux-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables

      - name: Verify Docker
        run: docker info

      - name: Run managerd race tests
        shell: bash -el {0}
        working-directory: services/sandbox-managerd
        run: conda run -n agent go test -race ./...

      - name: Run Linux Docker network boundary test
        shell: bash -el {0}
        working-directory: services/sandbox-managerd
        run: conda run -n agent go test -tags=integration ./internal/docker -run TestLinuxNetworkSecurityBoundary -count=1

  remote-environment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Verify Docker
        run: docker info

      - name: Run Codex remote environment compatibility test
        shell: bash -el {0}
        run: |
          conda run -n agent bash -lc '
            set -euo pipefail
            source scripts/test-remote-env.sh
            trap codex_remote_env_cleanup EXIT
            just test -p codex-core --test all remote_test_env_can_connect_and_use_filesystem
          '

      - name: Record scope of this workflow
        run: |
          echo "This workflow validates Codex remote-environment compatibility."
          echo "Its privileged fixture is not a RiftX production security acceptance test."

  sandbox-and-targets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Install Linux acceptance dependencies
        run: sudo apt-get update && sudo apt-get install -y nftables jq

      - name: Build RiftX sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sandbox/Dockerfile
          load: true
          push: false
          tags: riftx/sandbox:ci
          cache-from: type=gha,scope=riftx-sandbox
          cache-to: type=gha,mode=max,scope=riftx-sandbox

      - name: Verify pinned Juice Shop and DVWA fixtures
        run: bash scripts/riftx/linux-demo-acceptance.sh

      - name: Build Gateway E2E binaries
        shell: bash -el {0}
        run: |
          conda run -n agent sh -lc 'cd codex-rs && cargo build --locked -p codex-riftx-gateway -p codex-riftx-cli'
          conda run -n agent sh -lc 'cd services/sandbox-managerd && go build -o /tmp/riftx-sandbox-managerd ./cmd/sandbox-managerd'

      - name: Run deterministic Juice Shop Gateway loop
        env:
          RIFTX_MANAGER_BIN: /tmp/riftx-sandbox-managerd
        run: bash scripts/riftx/linux-gateway-e2e.sh
