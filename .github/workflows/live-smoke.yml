name: Optional OpenAI Live Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: Responses-compatible model id
        required: true
        type: string

permissions:
  contents: read

jobs:
  codex-live-smoke:
    runs-on: ubuntu-24.04
    environment: live-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Require protected API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Run Codex model smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RIFTX_TEST_MODEL: ${{ inputs.model }}
        shell: bash -el {0}
        run: >-
          conda run -n agent just exec --skip-git-repo-check
          --model "$RIFTX_TEST_MODEL"
          "Reply with exactly RIFTX_LIVE_OK and do not call tools."

