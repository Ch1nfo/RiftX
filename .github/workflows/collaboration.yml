name: Collaboration runtime and packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.18.1, 22, 24.18.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          python-version: '3.12'
          auto-activate-base: false
      - name: Install and verify the native SQLite module
        run: conda run -n agent npm ci --ignore-scripts
      - run: conda run -n agent npm rebuild better-sqlite3
      - run: conda run -n agent npm run typecheck
      - name: Collaboration and legacy lifecycle tests
        run: conda run -n agent npx tsx --conditions=import --test src/server/collaboration/*.test.ts src/server/pi/session-shutdown.test.ts src/server/pi/session-join.test.ts src/lib/session-events.test.ts
      - run: conda run -n agent npm run build
      - name: Pack, install and start the distributable
        run: conda run -n agent node tests/pack-collaboration.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          python-version: '3.12'
          auto-activate-base: false
      - run: conda run -n agent npm ci --ignore-scripts
      - run: conda run -n agent npm rebuild better-sqlite3
      - run: conda run -n agent npx playwright install --with-deps chromium
      - run: conda run -n agent npx playwright test tests/e2e/collaboration.spec.ts tests/e2e/attachments.spec.ts tests/e2e/archive-restore.spec.ts
