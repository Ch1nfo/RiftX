name: RiftX Provider Live Smoke

on:
  workflow_dispatch:
    inputs:
      responses_base_url:
        description: Responses-compatible API base URL (including /v1 when required)
        required: true
        default: https://api.openai.com/v1
        type: string
      responses_model:
        description: Responses provider model with function-tool support
        required: true
        default: gpt-5.2
        type: string
      chat_base_url:
        description: Chat Completions API base URL (including /v1 when required)
        required: true
        type: string
      chat_model:
        description: Chat Completions model with function-tool support
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: riftx-provider-live-smoke
  cancel-in-progress: false

jobs:
  dual-protocol-smoke:
    name: Responses + Chat Runtime tool loops
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Configure this GitHub Environment with required reviewers and these secrets:
    # RIFTX_LIVE_RESPONSES_API_KEY and RIFTX_LIVE_CHAT_API_KEY.
    environment: riftx-live-smoke
    env:
      CARGO_INCREMENTAL: "0"
      RIFTX_LIVE_RESPONSES_API_KEY: ${{ secrets.RIFTX_LIVE_RESPONSES_API_KEY }}
      RIFTX_LIVE_CHAT_API_KEY: ${{ secrets.RIFTX_LIVE_CHAT_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Require protected provider secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RIFTX_LIVE_RESPONSES_API_KEY"
          test -n "$RIFTX_LIVE_CHAT_API_KEY"
          echo "RIFTX_SMOKE_ROOT=$RUNNER_TEMP/riftx-live-smoke" >> "$GITHUB_ENV"

      - name: Build RiftX daemon and CLI
        working-directory: codex-rs
        shell: bash
        run: >-
          conda run --no-capture-output -n agent
          cargo build --locked
          -p codex-riftx-gateway
          -p codex-riftx-cli

      - name: Generate secret-free smoke configuration
        shell: bash
        env:
          RESPONSES_BASE_URL: ${{ inputs.responses_base_url }}
          RESPONSES_MODEL: ${{ inputs.responses_model }}
          CHAT_BASE_URL: ${{ inputs.chat_base_url }}
          CHAT_MODEL: ${{ inputs.chat_model }}
        run: |
          set -euo pipefail
          mkdir -p "$RIFTX_SMOKE_ROOT"
          conda run --no-capture-output -n agent python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RIFTX_SMOKE_ROOT"])
          quote = json.dumps
          config = f'''[daemon]
          ipc_dir = {quote(str(root / "ipc"))}
          state_db = {quote(str(root / "state.sqlite"))}
          runtime_home = {quote(str(root / "runtime"))}
          workspace_root = {quote(str(root / "workspaces"))}

          [tools]
          directories = []
          extra_paths = []

          [skills]

          [llm]
          default_profile = "responses_live"
          config_version = 2

          [llm.profiles.responses_live]
          enabled = true
          protocol = "responses"
          model = {quote(os.environ["RESPONSES_MODEL"])}
          base_url = {quote(os.environ["RESPONSES_BASE_URL"])}
          api_key = {{ source = "environment", variable = "RIFTX_LIVE_RESPONSES_API_KEY" }}
          timeout_seconds = 120
          reasoning_level = "medium"
          context_budget = 200000

          [llm.profiles.chat_live]
          enabled = true
          protocol = "chat_completions"
          model = {quote(os.environ["CHAT_MODEL"])}
          base_url = {quote(os.environ["CHAT_BASE_URL"])}
          api_key = {{ source = "environment", variable = "RIFTX_LIVE_CHAT_API_KEY" }}
          timeout_seconds = 120
          reasoning_level = "medium"
          context_budget = 200000

          [policy]
          allowed_capabilities = ["evidence.capture"]
          denied_cidrs = []
          denied_domains = []

          [audit]
          jsonl_path = {quote(str(root / "audit.jsonl"))}
          fsync = true

          [artifacts]
          root = {quote(str(root / "artifacts"))}
          max_bytes_per_engagement = 1048576
          '''
          (root / "riftx.toml").write_text(config, encoding="utf-8")
          PY

      - name: Run protected capability probes and Runtime tool loops
        shell: bash
        run: |
          set -euo pipefail
          config="$RIFTX_SMOKE_ROOT/riftx.toml"
          daemon_log="$RIFTX_SMOKE_ROOT/riftxd.log"
          results="$RIFTX_SMOKE_ROOT/results"
          riftx="$GITHUB_WORKSPACE/codex-rs/target/debug/riftx"
          riftxd="$GITHUB_WORKSPACE/codex-rs/target/debug/riftxd"
          mkdir -p "$results"

          cleanup() {
            if test -f "$RIFTX_SMOKE_ROOT/riftxd.pid"; then
              kill "$(cat "$RIFTX_SMOKE_ROOT/riftxd.pid")" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          conda run --no-capture-output -n agent \
            "$riftxd" --config "$config" >"$daemon_log" 2>&1 &
          echo "$!" > "$RIFTX_SMOKE_ROOT/riftxd.pid"

          ready=false
          for _ in $(seq 1 120); do
            if conda run --no-capture-output -n agent \
              "$riftx" --config "$config" llm profiles list --json >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat "$RIFTX_SMOKE_ROOT/riftxd.pid")" 2>/dev/null; then
              echo "riftxd exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done
          test "$ready" = true

          conda run --no-capture-output -n agent \
            "$riftx" --config "$config" llm profiles test responses_live --json \
            > "$results/responses-capability.json"
          conda run --no-capture-output -n agent \
            "$riftx" --config "$config" llm profiles test chat_live --json \
            > "$results/chat-capability.json"

          conda run --no-capture-output -n agent python3 scripts/riftx/run-live-smoke.py \
            --protocol responses \
            --profile responses_live \
            --riftx "$riftx" \
            --config "$config" \
            --ipc-socket "$RIFTX_SMOKE_ROOT/ipc/riftxd.sock" \
            --output-dir "$results"
          conda run --no-capture-output -n agent python3 scripts/riftx/run-live-smoke.py \
            --protocol chat \
            --profile chat_live \
            --riftx "$riftx" \
            --config "$config" \
            --ipc-socket "$RIFTX_SMOKE_ROOT/ipc/riftxd.sock" \
            --output-dir "$results"

          scan_args=(
            --scan-file "$daemon_log"
            --scan-file "$RIFTX_SMOKE_ROOT/audit.jsonl"
            --scan-file "$results/responses-events.stderr.log"
            --scan-file "$results/chat-events.stderr.log"
            --scan-file "$results/responses-report.json"
            --scan-file "$results/responses-conversation.json"
            --scan-file "$results/responses-events.ndjson"
            --scan-file "$results/chat-report.json"
            --scan-file "$results/chat-conversation.json"
            --scan-file "$results/chat-events.ndjson"
            --secret-env RIFTX_LIVE_RESPONSES_API_KEY
            --secret-env RIFTX_LIVE_CHAT_API_KEY
          )
          conda run --no-capture-output -n agent python3 scripts/riftx/verify-live-smoke.py \
            --protocol responses \
            --profile responses_live \
            --capability "$results/responses-capability.json" \
            --report "$results/responses-report.json" \
            --conversation "$results/responses-conversation.json" \
            --events "$results/responses-events.ndjson" \
            --expected-marker RIFTX_RESPONSES_FINAL_OK \
            --expected-artifact artifacts/responses-live-smoke.txt \
            "${scan_args[@]}" \
            --output "$results/responses-sanitized-summary.json"
          conda run --no-capture-output -n agent python3 scripts/riftx/verify-live-smoke.py \
            --protocol chat \
            --profile chat_live \
            --capability "$results/chat-capability.json" \
            --report "$results/chat-report.json" \
            --conversation "$results/chat-conversation.json" \
            --events "$results/chat-events.ndjson" \
            --expected-marker RIFTX_CHAT_FINAL_OK \
            --expected-artifact artifacts/chat-live-smoke.txt \
            "${scan_args[@]}" \
            --output "$results/chat-sanitized-summary.json"

      - name: Upload sanitized dual-protocol results
        uses: actions/upload-artifact@v4
        with:
          name: riftx-provider-live-smoke
          path: ${{ runner.temp }}/riftx-live-smoke/results/*-sanitized-summary.json
          if-no-files-found: error
          retention-days: 14
