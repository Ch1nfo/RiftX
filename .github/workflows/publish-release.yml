name: RiftX Publish Accepted Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft RiftX v* release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: riftx-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify M8 evidence and publish draft
    runs-on: ubuntu-24.04
    environment: riftx-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - id: source
        name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          version="$(cat VERSION)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be semantic and start with v" >&2
            exit 1
          fi
          test "$tag" = "v$version"
          test "$(git describe --tags --exact-match HEAD)" = "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download protected acceptance record from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir -p acceptance
          gh release download "$RELEASE_TAG" \
            --pattern "riftx-$RELEASE_VERSION-acceptance.json" \
            --dir acceptance
          test -f "acceptance/riftx-$RELEASE_VERSION-acceptance.json"

      - name: Verify complete M8 acceptance evidence
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          record="acceptance/riftx-$RELEASE_VERSION-acceptance.json"
          summary="acceptance/riftx-$RELEASE_VERSION-acceptance-summary.json"
          conda run --no-capture-output -n agent \
            python3 scripts/riftx/verify-release-acceptance.py \
            "$record" --output "$summary"
          conda run --no-capture-output -n agent python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          summary = json.loads(
              Path(f"acceptance/riftx-{version}-acceptance-summary.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = {
              "tag": os.environ["RELEASE_TAG"],
              "version": version,
              "sourceCommit": os.environ["RELEASE_COMMIT"],
              "decision": "go",
          }
          for field, value in expected.items():
              if summary.get(field) != value:
                  raise SystemExit(f"acceptance summary {field} does not match release source")
          PY

      - name: Replace raw evidence with summary and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          raw="riftx-$RELEASE_VERSION-acceptance.json"
          summary="acceptance/riftx-$RELEASE_VERSION-acceptance-summary.json"
          gh release delete-asset "$RELEASE_TAG" "$raw" --yes
          gh release upload "$RELEASE_TAG" "$summary" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
