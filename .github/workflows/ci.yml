name: RiftX CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-contracts:
    name: Local contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2022
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Test RiftX core and IPC contracts
        working-directory: codex-rs
        run: >-
          conda run -n agent just test
          -p codex-riftx-core -p codex-riftx-ipc -p codex-riftx-tools

      - name: Check local daemon and CLI
        working-directory: codex-rs
        run: >-
          conda run -n agent cargo check
          -p codex-riftx-gateway -p codex-riftx-cli

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Verify vendored upstream revision
        shell: bash -el {0}
        run: >-
          conda run -n agent python3 scripts/riftx/verify-upstream-lock.py
          --expected-commit 963cda85aa2a4cfb85e52d771d22d9f3069951fa

      - name: Check formatting
        shell: bash -el {0}
        run: conda run -n agent just fmt-check

      - name: Check integration crates
        shell: bash -el {0}
        run: >-
          conda run -n agent sh -lc
          'cd codex-rs && cargo check -p codex-app-server
          -p codex-riftx-app-server-adapter -p codex-riftx-core
          -p codex-riftx-ipc -p codex-riftx-tools
          -p codex-riftx-gateway -p codex-riftx-cli'

      - name: Test upstream lock verifier
        shell: bash -el {0}
        run: >-
          conda run -n agent python3 -m unittest
          scripts/riftx/test_verify_upstream_lock.py
