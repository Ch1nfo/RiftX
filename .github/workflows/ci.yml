name: RiftX CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Ordinary PR/push jobs must not require real provider API keys.
# Live smoke suites (when added) are workflow_dispatch-only with protected secrets.

jobs:
  upstream-lock:
    name: Upstream lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - name: Verify vendored upstream revision
        shell: bash -el {0}
        run: >-
          conda run -n agent python3 scripts/riftx/verify-upstream-lock.py
          --expected-commit 963cda85aa2a4cfb85e52d771d22d9f3069951fa

      - name: Test upstream lock verifier
        shell: bash -el {0}
        run: >-
          conda run -n agent python3 -m unittest
          scripts/riftx/test_verify_upstream_lock.py

      - name: Verify RiftX Desktop version source
        shell: bash -el {0}
        run: conda run -n agent python3 scripts/riftx/verify-version-sync.py

      - name: Test RiftX version verifier
        shell: bash -el {0}
        run: >-
          conda run -n agent python3 -m unittest
          scripts/riftx/test_verify_version_sync.py

      - name: Verify release toolchain pins
        shell: bash -el {0}
        run: conda run -n agent python3 scripts/riftx/verify-toolchain-lock.py

      - name: Test release policy verifiers
        shell: bash -el {0}
        run: >-
          conda run -n agent python3 -m unittest
          scripts/riftx/test_verify_toolchain_lock.py
          scripts/riftx/test_verify_license_reports.py
          scripts/riftx/test_verify_release_payload.py
          scripts/riftx/test_audit_rust_dependencies.py
          scripts/riftx/test_package_linux_release.py
          scripts/riftx/test_render_release_notes.py
          scripts/riftx/test_clean_generated.py
          scripts/riftx/test_run_live_smoke.py
          scripts/riftx/test_verify_live_smoke.py
          scripts/riftx/test_verify_release_acceptance.py

  supply-chain:
    name: Dependency, license, and SBOM checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Prepare supply-chain report directory
        run: mkdir -p build/supply-chain

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: build/supply-chain/riftx-source.cdx.json
          artifact-name: riftx-source-sbom

      - name: Install locked Node dependencies
        run: conda run -n agent pnpm install --frozen-lockfile

      - name: Audit Rust lockfiles
        shell: bash -el {0}
        run: >-
          conda run -n agent python3 scripts/riftx/audit-rust-dependencies.py
          --lockfile codex-rs/Cargo.lock
          --lockfile apps/desktop/src-tauri/Cargo.lock

      - name: Audit production Node dependencies
        run: conda run -n agent pnpm audit --prod --audit-level high

      - name: Generate dependency license reports
        shell: bash -el {0}
        run: |
          mkdir -p build/supply-chain
          conda run -n agent sh -lc 'cargo metadata --locked --format-version 1 --manifest-path codex-rs/Cargo.toml > build/supply-chain/cargo-codex.json'
          conda run -n agent sh -lc 'cargo metadata --locked --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml > build/supply-chain/cargo-desktop.json'
          conda run -n agent sh -lc 'pnpm licenses list --json > build/supply-chain/pnpm-licenses.json'

      - name: Enforce dependency license policy
        shell: bash -el {0}
        run: >-
          conda run -n agent python3 scripts/riftx/verify-license-reports.py
          --cargo-metadata build/supply-chain/cargo-codex.json
          --cargo-metadata build/supply-chain/cargo-desktop.json
          --pnpm-licenses build/supply-chain/pnpm-licenses.json

      - name: Upload supply-chain reports
        uses: actions/upload-artifact@v4
        with:
          name: riftx-supply-chain-reports
          path: build/supply-chain/
          if-no-files-found: error
          retention-days: 30

  rust-fmt-check:
    name: Rust fmt / check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Check formatting
        shell: bash -el {0}
        run: conda run -n agent just fmt-check

      - name: Check integration crates
        shell: bash -el {0}
        run: >-
          conda run -n agent sh -lc
          'cd codex-rs && cargo check -p codex-app-server
          -p codex-riftx-app-server-adapter -p codex-riftx-artifacts
          -p codex-riftx-core -p codex-riftx-credentials
          -p codex-riftx-crypto -p codex-riftx-domain
          -p codex-riftx-guard -p codex-riftx-ipc -p codex-riftx-llm-bridge -p codex-riftx-report
          -p codex-riftx-skills -p codex-riftx-tools
          -p codex-riftx-gateway -p codex-riftx-cli'

  app-server-protocol:
    name: App Server protocol fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Test App Server protocol fixtures
        working-directory: codex-rs
        run: >-
          conda run -n agent just test
          -p codex-app-server-protocol

  riftx-crate-tests:
    name: RiftX crate tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Test RiftX crates
        working-directory: codex-rs
        run: >-
          conda run -n agent just test
          -p codex-riftx-app-server-adapter
          -p codex-riftx-artifacts
          -p codex-riftx-cli
          -p codex-riftx-core
          -p codex-riftx-credentials
          -p codex-riftx-crypto
          -p codex-riftx-domain
          -p codex-riftx-guard
          -p codex-riftx-ipc
          -p codex-riftx-llm-bridge
          -p codex-riftx-report
          -p codex-riftx-skills
          -p codex-riftx-tools
          -p codex-riftx-gateway

  local-contracts:
    name: Local contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2022
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Test RiftX local contracts
        working-directory: codex-rs
        run: >-
          conda run -n agent just test
          -p codex-riftx-app-server-adapter
          -p codex-riftx-artifacts
          -p codex-riftx-cli
          -p codex-riftx-core
          -p codex-riftx-credentials
          -p codex-riftx-crypto
          -p codex-riftx-domain
          -p codex-riftx-guard
          -p codex-riftx-ipc
          -p codex-riftx-llm-bridge
          -p codex-riftx-report
          -p codex-riftx-skills
          -p codex-riftx-tools

      - name: Run Native daemon and lifecycle acceptance
        working-directory: codex-rs
        run: >-
          conda run -n agent just test
          -p codex-riftx-gateway

  desktop-frontend:
    name: Desktop frontend tests/build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install desktop dependencies
        run: >-
          conda run -n agent pnpm install
          --filter @riftx/desktop...
          --frozen-lockfile

      - name: Check desktop frontend and E2E types
        run: conda run -n agent pnpm --filter @riftx/desktop check

      - name: Test desktop frontend
        run: conda run -n agent pnpm --filter @riftx/desktop test

      - name: Test desktop mock E2E
        run: conda run -n agent pnpm --filter @riftx/desktop test:e2e

      - name: Upload desktop visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-${{ matrix.os }}
          path: apps/desktop/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Build desktop frontend
        run: conda run -n agent pnpm --filter @riftx/desktop build

  tauri-bridge:
    name: Tauri bridge tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: agent
          environment-file: .github/agent-environment.yml
          miniforge-version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            codex-rs

      - name: Install desktop dependencies
        run: >-
          conda run -n agent pnpm install
          --filter @riftx/desktop...
          --frozen-lockfile

      - name: Test desktop frontend
        run: conda run -n agent pnpm --filter @riftx/desktop test

      - name: Build desktop frontend
        run: conda run -n agent pnpm --filter @riftx/desktop build

      - name: Prepare daemon sidecar
        env:
          RIFTX_SIDECAR_PROFILE: debug
        run: >-
          conda run -n agent pnpm
          --filter @riftx/desktop prepare:sidecar

      - name: Test Tauri bridge
        run: conda run -n agent just test-desktop-bridge
