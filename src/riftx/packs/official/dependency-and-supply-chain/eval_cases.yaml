- case_id: eval.dependency-and-supply-chain.baseline
  capability_ids: [dependency-and-supply-chain, dependency-and-supply-chain.technique]
  description: Review a multi-ecosystem repository with locks, workspace overrides, Git and path sources, install scripts, vendored code, and unused development dependencies.
  scenario: builtin://eval/dependency-and-supply-chain/baseline-v1
  assertions:
    - Dependency identity, version, source, integrity, lock state, scope, and effective consumer are evidence-backed.
    - Alternate registries, Git or path dependencies, workspace overrides, install hooks, generated artifacts, and build inputs remain distinct risks.
    - Offline review does not invent advisories, package ownership, registry state, exploitability, or freshness.
    - Unused, development-only, unreachable, correctly locked, or vendored-and-verified dependencies become durable negative results.
  negative_case_ids:
    - negative.dependency-and-supply-chain.unused-development
    - negative.dependency-and-supply-chain.unverified-advisory
