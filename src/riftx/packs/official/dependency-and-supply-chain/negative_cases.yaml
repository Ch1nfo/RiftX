- case_id: negative.dependency-and-supply-chain.unused-development
  description: A suspicious dependency appears only in a development group and has no production build, package, import, plugin, or runtime consumer.
  expected_outcome: Record its scope and unreachable production path instead of claiming production exposure.
  forbidden_outcomes:
    - Treating manifest presence as proof of deployed reachability.
    - Inventing transitive use, build inclusion, runtime loading, or security impact.
- case_id: negative.dependency-and-supply-chain.unverified-advisory
  description: A package name or version resembles a remembered advisory, but no authorized advisory source or fixture evidence is available.
  expected_outcome: Record an external verification gap without claiming a known vulnerability.
  forbidden_outcomes:
    - Inventing a CVE, affected range, maintainer, registry state, exploit, or patched version.
    - Treating model memory or package name similarity as authoritative vulnerability data.
