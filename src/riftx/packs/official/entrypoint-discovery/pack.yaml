schema_version: riftx.official-pack-source/v1
pack_id: entrypoint-discovery
version: 1.0.0
title: Entrypoint Discovery
description: Evidence-backed discovery of externally influenced and privileged code entrypoints.
authored_by: RiftX Security Team
authored_at: 2026-08-06T00:00:00Z
tool_requirements:
  - glob
  - grep
  - read_many_files
  - symbol_search
  - find_references
  - call_hierarchy
  - record_observation
  - propose_hypothesis
  - record_negative_result
evidence_contract: &pack_evidence
  required_refs:
    - source_snapshot
    - entrypoint_location
    - reachability_evidence
    - input_or_privilege_boundary
  minimum_independent_sources: 1
  confirmation_policy: explicit_verification
skill_ids: [entrypoint-discovery]
capabilities:
  - capability_id: entrypoint-discovery
    kind: skill
    title: Entrypoint Discovery Procedure
    description: Identify externally influenced, scheduled, event-driven, administrative, and privileged entrypoints with source and reachability evidence.
    domains: [code-audit, entrypoints, attack-surface]
    triggers: [entrypoint discovery, source-to-sink analysis, attack surface]
    dependencies:
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: call_hierarchy}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema:
      type: object
      required: [source_snapshot, repository_map]
      properties:
        source_snapshot: {type: string}
        repository_map: {type: object}
        focus: {type: array, items: {type: string}}
    output_schema:
      type: object
      required: [entrypoints, input_boundaries, privileged_paths, unresolved_candidates]
      properties:
        entrypoints: {type: array, items: {type: object}}
        input_boundaries: {type: array, items: {type: object}}
        privileged_paths: {type: array, items: {type: object}}
        unresolved_candidates: {type: array, items: {type: object}}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.entrypoint-discovery.baseline]
  - capability_id: entrypoint-discovery.technique
    kind: technique
    title: Entrypoint and Input Boundary Enumeration
    description: Combine framework configuration, registration sites, symbols, references, and callers to distinguish reachable entrypoints from name-only candidates.
    domains: [code-audit, entrypoints, reachability]
    triggers: [route discovery, handler discovery, privileged callback]
    dependencies:
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: call_hierarchy}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.entrypoint-discovery.baseline]
  - capability_id: eval.entrypoint-discovery.baseline
    kind: eval_case
    title: Entrypoint Discovery Baseline Case
    description: Checks registration evidence, input and identity boundaries, reachability quality, duplicate suppression, and unresolved candidates.
    domains: [code-audit, entrypoints, evaluation]
    triggers: [pack validation]
    permission:
      effect_class: read_only
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract:
      required_refs: [evaluation_result]
      minimum_independent_sources: 1
      confirmation_policy: manual_review
