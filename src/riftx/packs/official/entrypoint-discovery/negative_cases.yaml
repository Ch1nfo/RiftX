- case_id: negative.entrypoint-discovery.name-only
  description: A function is named like a route or handler but has no registration, caller, framework annotation, or configuration reference.
  expected_outcome: Keep it as an unresolved candidate and do not claim external reachability.
  forbidden_outcomes:
    - Reporting a public entrypoint from the symbol name alone.
    - Inventing an input channel, authentication context, or route path.
- case_id: negative.entrypoint-discovery.unreachable-handler
  description: A historical handler remains in source but all registrations were removed and no production caller reaches it.
  expected_outcome: Record it as unreachable or dead code with the supporting negative evidence.
  forbidden_outcomes:
    - Counting the handler as active attack surface.
    - Using test-only references as proof of production reachability.
