schema_version: riftx.official-pack-source/v1
pack_id: secret-and-config-audit
version: 1.0.0
title: Secret and Configuration Audit
description: Redaction-safe review of embedded secrets, secret exposure paths, insecure defaults, and security-critical configuration behavior.
authored_by: RiftX Security Team
authored_at: 2026-08-06T00:00:00Z
tool_requirements:
  - list_files
  - glob
  - grep
  - read_many_files
  - symbol_search
  - find_references
  - record_observation
  - propose_hypothesis
  - propose_finding
  - record_negative_result
evidence_contract: &pack_evidence
  required_refs:
    - source_snapshot
    - redacted_source_location
    - secret_or_setting_classification
    - effective_consumer_or_behavior
    - exposure_or_defense_evidence
  minimum_independent_sources: 1
  confirmation_policy: explicit_verification
skill_ids: [secret-and-config-audit]
capabilities:
  - capability_id: secret-and-config-audit
    kind: skill
    title: Secret and Configuration Audit Procedure
    description: Identify real secret material and security-critical settings, trace effective consumers, and preserve evidence without exposing raw values.
    domains: [code-audit, secrets, configuration]
    triggers: [secret audit, insecure configuration, credential exposure]
    dependencies:
      - {kind: tool, reference: list_files}
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: propose_finding}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema:
      type: object
      required: [source_snapshot, repository_map]
      properties:
        source_snapshot: {type: string}
        repository_map: {type: object}
        configuration_surfaces: {type: array, items: {type: string}}
    output_schema:
      type: object
      required: [secret_candidates, configuration_findings, redacted_evidence, negative_results, coverage_gaps]
      properties:
        secret_candidates: {type: array, items: {type: object}}
        configuration_findings: {type: array, items: {type: object}}
        redacted_evidence: {type: array, items: {type: object}}
        negative_results: {type: array, items: {type: object}}
        coverage_gaps: {type: array, items: {type: object}}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.secret-and-config-audit.baseline]
  - capability_id: secret-and-config-audit.technique
    kind: technique
    title: Redaction-safe Secret and Effective Configuration Tracing
    description: Classify secret-like material and security settings, trace their effective consumers, and record only locations, fingerprints, value classes, and redacted shapes.
    domains: [code-audit, secrets, secure-configuration]
    triggers: [embedded credential, insecure default, debug exposure]
    dependencies:
      - {kind: tool, reference: list_files}
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: propose_finding}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.secret-and-config-audit.baseline]
  - capability_id: eval.secret-and-config-audit.baseline
    kind: eval_case
    title: Secret and Configuration Audit Baseline Case
    description: Checks redaction, real-versus-placeholder classification, effective configuration consumers, deployment reachability, and durable negative paths.
    domains: [code-audit, secrets, configuration, evaluation]
    triggers: [pack validation]
    permission:
      effect_class: read_only
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract:
      required_refs: [evaluation_result]
      minimum_independent_sources: 1
      confirmation_policy: manual_review
