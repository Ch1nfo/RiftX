- case_id: eval.secret-and-config-audit.baseline
  capability_ids: [secret-and-config-audit, secret-and-config-audit.technique]
  description: Review production, example, test, generated, deployment, and environment configuration containing real, placeholder, rotated, and indirect secret values.
  scenario: builtin://eval/secret-and-config-audit/baseline-v1
  assertions:
    - Evidence never includes raw secret values and uses only location, value class, redacted shape, fingerprint, and consumer metadata.
    - Secret candidates distinguish real credentials or key material from placeholders, examples, test fixtures, public identifiers, and encrypted blobs.
    - Configuration findings identify the effective consumer, precedence, deployment reachability, unsafe behavior, and relevant secure default or override.
    - Inactive, overridden, placeholder, test-only, generated, or unreachable values become durable negative results.
  negative_case_ids:
    - negative.secret-and-config-audit.placeholder
    - negative.secret-and-config-audit.inactive-setting
