schema_version: riftx.official-pack-source/v1
pack_id: authn-authz-audit
version: 1.0.0
title: Authentication and Authorization Audit
description: Evidence-backed review of identity establishment, session trust, authorization decisions, and tenant or object boundaries.
authored_by: RiftX Security Team
authored_at: 2026-08-06T00:00:00Z
tool_requirements:
  - glob
  - grep
  - read_many_files
  - symbol_search
  - find_references
  - call_hierarchy
  - record_observation
  - propose_hypothesis
  - propose_finding
  - record_negative_result
evidence_contract: &pack_evidence
  required_refs:
    - source_snapshot
    - protected_entrypoint
    - identity_or_session_source
    - authorization_enforcement
    - bypass_or_defense_evidence
  minimum_independent_sources: 1
  confirmation_policy: explicit_verification
skill_ids: [authn-authz-audit]
capabilities:
  - capability_id: authn-authz-audit
    kind: skill
    title: Authentication and Authorization Audit Procedure
    description: Trace identity, session, role, tenant, object, and privilege decisions from protected entrypoints to authoritative enforcement.
    domains: [code-audit, authentication, authorization]
    triggers: [auth audit, access control review, tenant isolation]
    dependencies:
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: call_hierarchy}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: propose_finding}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema:
      type: object
      required: [source_snapshot, entrypoint_catalog]
      properties:
        source_snapshot: {type: string}
        entrypoint_catalog: {type: object}
        protected_resources: {type: array, items: {type: string}}
    output_schema:
      type: object
      required: [identity_flows, enforcement_points, candidates, negative_results, coverage_gaps]
      properties:
        identity_flows: {type: array, items: {type: object}}
        enforcement_points: {type: array, items: {type: object}}
        candidates: {type: array, items: {type: object}}
        negative_results: {type: array, items: {type: object}}
        coverage_gaps: {type: array, items: {type: object}}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.authn-authz-audit.baseline]
  - capability_id: authn-authz-audit.technique
    kind: technique
    title: Identity-to-Resource Enforcement Tracing
    description: Compare attacker-influenced identity and resource selectors with the authoritative authentication and authorization checks on every protected path.
    domains: [code-audit, identity, access-control]
    triggers: [missing authorization, tenant bypass, session confusion]
    dependencies:
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: call_hierarchy}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: propose_finding}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.authn-authz-audit.baseline]
  - capability_id: eval.authn-authz-audit.baseline
    kind: eval_case
    title: Authentication and Authorization Baseline Case
    description: Checks identity provenance, enforcement reachability, tenant and object binding, default-deny behavior, and evidence-backed non-findings.
    domains: [code-audit, authentication, authorization, evaluation]
    triggers: [pack validation]
    permission:
      effect_class: read_only
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract:
      required_refs: [evaluation_result]
      minimum_independent_sources: 1
      confirmation_policy: manual_review
