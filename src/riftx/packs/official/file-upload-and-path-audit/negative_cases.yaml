- case_id: negative.file-upload-and-path-audit.canonical-containment
  description: An attacker controls path segments, but the implementation resolves the final path and rejects every result outside the immutable storage root before any filesystem side effect.
  expected_outcome: Record the verified containment as a negative result unless a link, race, decoding, or alternate sink bypass is evidenced.
  forbidden_outcomes:
    - Reporting traversal from path control or join syntax alone.
    - Ignoring effective final-path containment and rejection behavior.
- case_id: negative.file-upload-and-path-audit.generated-storage-key
  description: Original filenames are retained only as metadata while storage uses a server-generated opaque key in a non-executable, non-public root.
  expected_outcome: Record filename separation and serving policy instead of claiming arbitrary path write or code execution.
  forbidden_outcomes:
    - Treating metadata filenames as filesystem paths without a reachable consumer.
    - Inventing public serving, executable placement, overwrite, or interpreter behavior.
