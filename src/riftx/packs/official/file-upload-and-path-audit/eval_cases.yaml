- case_id: eval.file-upload-and-path-audit.baseline
  capability_ids: [file-upload-and-path-audit, file-upload-and-path-audit.technique]
  description: Review uploads, downloads, archive extraction, temporary files, storage keys, static serving, delete operations, and local path joins with vulnerable and contained variants.
  scenario: builtin://eval/file-upload-and-path-audit/baseline-v1
  assertions:
    - Candidates identify attacker control over content, metadata, name, archive entry, identifier, or path component and the reachable sink.
    - Decoding, normalization, canonicalization, containment, link behavior, collisions, overwrite policy, and serving or execution context are evaluated in order.
    - Controllable filenames, extensions, MIME values, or path joins alone do not prove traversal, overwrite, execution, or disclosure.
    - Canonically contained, generated-name, unreachable, test-only, and correctly rejected paths become durable negative results.
  negative_case_ids:
    - negative.file-upload-and-path-audit.canonical-containment
    - negative.file-upload-and-path-audit.generated-storage-key
