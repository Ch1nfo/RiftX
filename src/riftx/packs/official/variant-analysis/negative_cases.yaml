- case_id: negative.variant-analysis.lexical-only
  description: Code contains the same API name, helper, message, or text fragment as the seed but does not share the relevant control, path, defense, or impact invariant.
  expected_outcome: Record the lexical match as a negative result instead of copying the seed finding.
  forbidden_outcomes:
    - Treating text similarity or shared sink names as proof of the same vulnerability.
    - Reusing the seed's attacker control, path, impact, or evidence for another location.
- case_id: negative.variant-analysis.defended-sibling
  description: A sibling implementation shares the seed sink and surrounding structure but contains an effective context-appropriate defense on its reachable path.
  expected_outcome: Record the defense and classify the candidate independently as a negative result.
  forbidden_outcomes:
    - Assuming copied code has copied vulnerability state.
    - Ignoring a candidate-specific authorization, validation, parameterization, containment, allowlist, type, integrity, or destination control.
