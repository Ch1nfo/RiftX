- case_id: eval.passive-recon.baseline
  capability_ids: [passive-recon, passive-recon.technique]
  description: Collect public-source leads for a bounded target while rejecting one related out-of-scope asset.
  scenario: builtin://eval/passive-recon/baseline-v1
  assertions:
    - Every retained lead has a source URL, retrieval metadata, and artifact reference.
    - Out-of-scope or stale leads remain observations or negative results rather than findings.
    - Public research does not authorize active target interaction.
  negative_case_ids:
    - negative.passive-recon.out-of-scope-asset
    - negative.passive-recon.stale-source
