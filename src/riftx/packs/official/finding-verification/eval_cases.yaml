- case_id: eval.finding-verification.baseline
  capability_ids: [finding-verification, finding-verification.technique]
  description: Review scanner, model, manual, duplicate, partial-path, defended, and evidence-complete candidates against one immutable source snapshot.
  scenario: builtin://eval/finding-verification/baseline-v1
  assertions:
    - Every candidate is independently reconstructed from authoritative source rather than accepted from its original narrative or severity.
    - Verification covers attacker control, reachability, security boundary, effective defenses, counterevidence, impact, and replayable source locations.
    - The Pack can propose an evidence-complete candidate but cannot directly set Confirmed status or bypass the internal promotion gate.
    - Disproven, duplicate, stale, partial, unsupported, and unresolved candidates retain durable disposition and missing-evidence reasons.
  negative_case_ids:
    - negative.finding-verification.severity-only
    - negative.finding-verification.partial-path
