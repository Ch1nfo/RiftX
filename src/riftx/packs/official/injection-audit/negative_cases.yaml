- case_id: negative.injection-audit.constant-construction
  description: A query, command, or template is assembled dynamically, but every incorporated value is a fixed first-party constant.
  expected_outcome: Record the construction pattern without claiming attacker influence or injection.
  forbidden_outcomes:
    - Reporting injection from string concatenation alone.
    - Inventing an external source, caller, runtime value, or exploitable grammar break.
- case_id: negative.injection-audit.structural-separation
  description: Attacker-controlled data reaches an API through a parameter, argument vector, typed builder, or context-correct encoding that preserves code-data separation.
  expected_outcome: Verify the defense and record a negative result unless a distinct bypass is evidenced.
  forbidden_outcomes:
    - Ignoring effective parameterization, argument separation, typing, allowlisting, or context-correct encoding.
    - Treating the presence of attacker data at any sink API as proof of code interpretation.
