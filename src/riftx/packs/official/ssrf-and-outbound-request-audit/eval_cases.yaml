- case_id: eval.ssrf-and-outbound-request-audit.baseline
  capability_ids: [ssrf-and-outbound-request-audit, ssrf-and-outbound-request-audit.technique]
  description: Review webhooks, URL previews, imports, callbacks, proxying, image fetches, service clients, redirects, and fixed-host requests with attacker-controlled bodies.
  scenario: builtin://eval/ssrf-and-outbound-request-audit/baseline-v1
  assertions:
    - Candidates identify which scheme, authority, host, port, path, query, redirect, proxy, or address component is attacker controlled.
    - Parsing, normalization, DNS or IP checks, redirects, proxy behavior, credentials, network reachability, and response handling are evaluated on the effective path.
    - Attacker-controlled request bodies, headers, or paths to a fixed approved destination do not become SSRF without destination influence.
    - Effective destination allowlists, blocked address classes, redirect revalidation, fixed hosts, and unreachable sinks become durable negative results.
  negative_case_ids:
    - negative.ssrf-and-outbound-request-audit.fixed-destination
    - negative.ssrf-and-outbound-request-audit.revalidated-allowlist
