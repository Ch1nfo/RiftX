schema_version: riftx.official-pack-source/v1
pack_id: ssrf-and-outbound-request-audit
version: 1.0.0
title: SSRF and Outbound Request Audit
description: Evidence-backed review of attacker influence over outbound destinations, redirects, resolution, network policy, credentials, and response handling.
authored_by: RiftX Security Team
authored_at: 2026-08-06T00:00:00Z
tool_requirements:
  - glob
  - grep
  - read_many_files
  - symbol_search
  - find_references
  - call_hierarchy
  - record_observation
  - propose_hypothesis
  - propose_finding
  - record_negative_result
evidence_contract: &pack_evidence
  required_refs:
    - source_snapshot
    - attacker_controlled_destination_component
    - outbound_request_sink
    - parsing_resolution_and_redirect_path
    - destination_policy_or_impact_evidence
  minimum_independent_sources: 1
  confirmation_policy: explicit_verification
skill_ids: [ssrf-and-outbound-request-audit]
capabilities:
  - capability_id: ssrf-and-outbound-request-audit
    kind: skill
    title: SSRF and Outbound Request Audit Procedure
    description: Trace attacker influence into outbound protocols and destinations and verify parsing, resolution, redirect, proxy, credential, and response policies.
    domains: [code-audit, ssrf, outbound-request]
    triggers: [SSRF audit, webhook fetch, outbound URL]
    dependencies:
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: call_hierarchy}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: propose_finding}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema:
      type: object
      required: [source_snapshot, entrypoint_catalog]
      properties:
        source_snapshot: {type: string}
        entrypoint_catalog: {type: object}
        outbound_client_surfaces: {type: array, items: {type: string}}
    output_schema:
      type: object
      required: [destination_flows, request_sinks, policies, candidate_findings, negative_results, coverage_gaps]
      properties:
        destination_flows: {type: array, items: {type: object}}
        request_sinks: {type: array, items: {type: object}}
        policies: {type: array, items: {type: object}}
        candidate_findings: {type: array, items: {type: object}}
        negative_results: {type: array, items: {type: object}}
        coverage_gaps: {type: array, items: {type: object}}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.ssrf-and-outbound-request-audit.baseline]
  - capability_id: ssrf-and-outbound-request-audit.technique
    kind: technique
    title: Destination Control and Network Trust Boundary Tracing
    description: Establish destination-component control, parser semantics, DNS or address policy, redirects, proxies, credentials, reachable network context, and response impact.
    domains: [code-audit, ssrf, network-boundary]
    triggers: [user supplied URL, redirect following, internal fetch]
    dependencies:
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: call_hierarchy}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: propose_finding}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.ssrf-and-outbound-request-audit.baseline]
  - capability_id: eval.ssrf-and-outbound-request-audit.baseline
    kind: eval_case
    title: SSRF and Outbound Request Audit Baseline Case
    description: Checks destination control, parsing and normalization, DNS and address policy, redirects, proxies, credentials, network context, response use, and durable negative paths.
    domains: [code-audit, ssrf, outbound-request, evaluation]
    triggers: [pack validation]
    permission:
      effect_class: read_only
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract:
      required_refs: [evaluation_result]
      minimum_independent_sources: 1
      confirmation_policy: manual_review
