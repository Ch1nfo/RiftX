- case_id: negative.ssrf-and-outbound-request-audit.fixed-destination
  description: Attacker-controlled data changes only the request body, headers, or resource path while scheme, host, port, proxy, and redirects remain fixed to an approved service.
  expected_outcome: Record the destination as fixed and evaluate other risks separately instead of reporting SSRF.
  forbidden_outcomes:
    - Treating any attacker influence over an outbound request as destination control.
    - Inventing host, port, scheme, redirect, proxy, or DNS influence.
- case_id: negative.ssrf-and-outbound-request-audit.revalidated-allowlist
  description: The final parsed destination and every redirect are normalized, resolved, checked against an immutable allowlist and blocked address classes, then connected without an intervening attacker-controlled resolution step.
  expected_outcome: Record the verified destination policy as a negative result unless a concrete parser, resolution, race, or proxy bypass is evidenced.
  forbidden_outcomes:
    - Ignoring final-destination and redirect revalidation.
    - Inventing DNS rebinding, parser differential, proxy bypass, or internal reachability without source evidence.
