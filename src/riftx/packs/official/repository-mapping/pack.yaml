schema_version: riftx.official-pack-source/v1
pack_id: repository-mapping
version: 1.0.0
title: Repository Mapping
description: Bounded mapping of source layout, languages, frameworks, trust boundaries, and high-risk subsystems.
authored_by: RiftX Security Team
authored_at: 2026-08-06T00:00:00Z
tool_requirements:
  - list_files
  - glob
  - read_many_files
  - grep
  - symbol_search
  - find_references
  - record_observation
  - record_negative_result
evidence_contract: &pack_evidence
  required_refs:
    - source_snapshot
    - repository_inventory
    - language_and_framework_map
    - trust_boundary_map
  minimum_independent_sources: 1
  confirmation_policy: explicit_verification
skill_ids: [repository-mapping]
capabilities:
  - capability_id: repository-mapping
    kind: skill
    title: Repository Mapping Procedure
    description: Build an evidence-backed repository map without executing the project or treating generated and vendored trees as first-party logic.
    domains: [code-audit, repository, architecture]
    triggers: [repository mapping, architecture discovery, audit scoping]
    dependencies:
      - {kind: tool, reference: list_files}
      - {kind: tool, reference: glob}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema:
      type: object
      required: [source_snapshot]
      properties:
        source_snapshot: {type: string}
        focus: {type: array, items: {type: string}}
    output_schema:
      type: object
      required: [roots, languages, frameworks, trust_boundaries, exclusions]
      properties:
        roots: {type: array, items: {type: object}}
        languages: {type: array, items: {type: object}}
        frameworks: {type: array, items: {type: object}}
        trust_boundaries: {type: array, items: {type: object}}
        exclusions: {type: array, items: {type: object}}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.repository-mapping.baseline]
  - capability_id: repository-mapping.technique
    kind: technique
    title: Evidence-backed Repository Decomposition
    description: Separate first-party source, generated output, vendored dependencies, configuration, tests, and deployment surfaces before deeper audit work.
    domains: [code-audit, architecture, coverage]
    triggers: [large repository, monorepo, unknown framework]
    dependencies:
      - {kind: tool, reference: list_files}
      - {kind: tool, reference: glob}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.repository-mapping.baseline]
  - capability_id: eval.repository-mapping.baseline
    kind: eval_case
    title: Repository Mapping Baseline Case
    description: Checks bounded inventory, evidence-backed framework detection, generated/vendor separation, and explicit unknowns.
    domains: [code-audit, repository, evaluation]
    triggers: [pack validation]
    permission:
      effect_class: read_only
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract:
      required_refs: [evaluation_result]
      minimum_independent_sources: 1
      confirmation_policy: manual_review
