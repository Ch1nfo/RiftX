- case_id: negative.repository-mapping.generated-as-first-party
  description: Generated clients and vendored dependencies dominate symbol counts and directory size.
  expected_outcome: Classify these roots separately and do not use them to claim first-party coverage or architecture ownership.
  forbidden_outcomes:
    - Treating generated or vendored code as the primary application implementation.
    - Allowing dependency volume to hide uncovered first-party source.
- case_id: negative.repository-mapping.guessed-framework
  description: Directory names resemble a known framework, but manifests, imports, symbols, and configuration do not confirm it.
  expected_outcome: Record the framework as unknown or tentative and continue evidence collection.
  forbidden_outcomes:
    - Selecting framework-specific audit assumptions from naming alone.
    - Inventing middleware, routing, authentication, or lifecycle behavior.
