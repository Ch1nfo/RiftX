schema_version: riftx.official-pack-source/v1
pack_id: deserialization-audit
version: 1.0.0
title: Deserialization Audit
description: Evidence-backed review of untrusted structured data, type resolution, object construction, hooks, gadget reachability, and integrity controls.
authored_by: RiftX Security Team
authored_at: 2026-08-06T00:00:00Z
tool_requirements:
  - glob
  - grep
  - read_many_files
  - symbol_search
  - find_references
  - call_hierarchy
  - record_observation
  - propose_hypothesis
  - propose_finding
  - record_negative_result
evidence_contract: &pack_evidence
  required_refs:
    - source_snapshot
    - attacker_controlled_serialized_input
    - parser_and_type_resolution_path
    - object_hook_or_gadget_path
    - integrity_allowlist_or_impact_evidence
  minimum_independent_sources: 1
  confirmation_policy: explicit_verification
skill_ids: [deserialization-audit]
capabilities:
  - capability_id: deserialization-audit
    kind: skill
    title: Deserialization Audit Procedure
    description: Trace untrusted structured input through parsing, type selection, construction, callbacks, and reachable side effects while evaluating schema, allowlist, and integrity controls.
    domains: [code-audit, deserialization, object-construction]
    triggers: [deserialization audit, polymorphic type, object hook]
    dependencies:
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: call_hierarchy}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: propose_finding}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema:
      type: object
      required: [source_snapshot, entrypoint_catalog]
      properties:
        source_snapshot: {type: string}
        entrypoint_catalog: {type: object}
        serialization_surfaces: {type: array, items: {type: string}}
    output_schema:
      type: object
      required: [parsers, type_resolution_paths, hook_or_gadget_candidates, defenses, negative_results, coverage_gaps]
      properties:
        parsers: {type: array, items: {type: object}}
        type_resolution_paths: {type: array, items: {type: object}}
        hook_or_gadget_candidates: {type: array, items: {type: object}}
        defenses: {type: array, items: {type: object}}
        negative_results: {type: array, items: {type: object}}
        coverage_gaps: {type: array, items: {type: object}}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.deserialization-audit.baseline]
  - capability_id: deserialization-audit.technique
    kind: technique
    title: Untrusted Data to Object Hook Tracing
    description: Establish input control, parser mode, type resolution, constructed class, lifecycle hooks, reachable gadgets, side effects, and integrity or allowlist defenses.
    domains: [code-audit, deserialization, gadget-analysis]
    triggers: [unsafe loader, dynamic type, deserialization callback]
    dependencies:
      - {kind: tool, reference: glob}
      - {kind: tool, reference: grep}
      - {kind: tool, reference: read_many_files}
      - {kind: tool, reference: symbol_search}
      - {kind: tool, reference: find_references}
      - {kind: tool, reference: call_hierarchy}
      - {kind: tool, reference: record_observation}
      - {kind: tool, reference: propose_hypothesis}
      - {kind: tool, reference: propose_finding}
      - {kind: tool, reference: record_negative_result}
    permission:
      effect_class: local_mutation
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract: *pack_evidence
    evaluation_case_ids: [eval.deserialization-audit.baseline]
  - capability_id: eval.deserialization-audit.baseline
    kind: eval_case
    title: Deserialization Audit Baseline Case
    description: Checks input trust, parser mode, type resolution, object hooks, gadget reachability, integrity and allowlist defenses, and durable negative paths.
    domains: [code-audit, deserialization, evaluation]
    triggers: [pack validation]
    permission:
      effect_class: read_only
      approval_level: never
      requires_scope: false
    input_schema: {type: object}
    output_schema: {type: object}
    evidence_contract:
      required_refs: [evaluation_result]
      minimum_independent_sources: 1
      confirmation_policy: manual_review
