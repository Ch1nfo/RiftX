- case_id: negative.deserialization-audit.schema-only
  description: Untrusted structured input is parsed into inert primitives and validated against a fixed schema without dynamic type resolution, object hooks, or implicit execution.
  expected_outcome: Record the fixed data model and defenses as a negative result unless a separate parser or downstream sink is evidenced.
  forbidden_outcomes:
    - Reporting unsafe deserialization from JSON, YAML, XML, or binary parsing alone.
    - Inventing dynamic object construction, callbacks, gadget classes, or side effects.
- case_id: negative.deserialization-audit.unreachable-hook
  description: A class has a dangerous lifecycle hook, but the reviewed parser cannot select or instantiate that class from the attacker-controlled input path.
  expected_outcome: Record the missing type-selection and reachability edges instead of reporting an exploitable gadget.
  forbidden_outcomes:
    - Treating a dangerous method anywhere in the repository as a reachable gadget.
    - Inventing classpath presence, registration, constructor selection, callback order, or impact.
