- case_id: eval.code-audit-foundation.baseline
  capability_ids: [code-audit-foundation, code-audit-foundation.technique]
  description: Exercise one immutable source snapshot through audit planning, evidence capture, a disproven branch, and Closure.
  scenario: builtin://eval/code-audit-foundation/baseline-v1
  assertions:
    - Every audit task identifies a bounded source region, stop condition, and evidence requirement.
    - Candidate findings remain unconfirmed until their source path and reasoning are evidence-backed.
    - Exhausted or disproven paths become durable negative results instead of disappearing.
    - Completion reports complete or partial Closure without reading mutable Audit output.
  negative_case_ids:
    - negative.code-audit-foundation.mutable-output
    - negative.code-audit-foundation.unsupported-finding
